name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Prepare Build Environment
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace -x test > build.log 2>&1 || true

      - name: Capture Build Log to Git
        run: |
          tail -n 300 build.log > build_error.txt
          git config user.name "CI Bot"
          git config user.email "ci@example.com"
          git add build_error.txt
          git commit -m "ci: capture build error log" || true
          git push origin main || true

      - name: Fail if build failed
        run: |
          if grep -q "BUILD SUCCESSFUL" build.log; then
            echo "Build passed!"
          else
            echo "Build failed!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnsweringMachine-APK
          path: app/build/**/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Answering Machine v1.0.0 (APK)"
          body: |
            ### 📞 Answering Machine Android App (v1.0.0)
            
            Automated build generated by GitHub Actions.
            
            #### Features Included:
            - **Personalized Voice Greetings Studio:** Record voice greetings or synthesize with AI TTS.
            - **Incoming Call Screening Simulator:** Real-time caller voice transcription and decibel meter.
            - **Voicemail Inbox:** AI summaries, bullet action points, and audio waveform playback.
            - **Zero-Knowledge Privacy:** 100% on-device local storage.
            
            #### Download:
            Download the APK file below and install it directly on your Android device.
          files: app/build/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
