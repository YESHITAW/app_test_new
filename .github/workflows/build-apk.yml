name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Build Environment
        run: |
          # Copy .env.example if .env is missing
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          
          # Generate debug.keystore if not present to satisfy signingConfig in build.gradle.kts
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Collect Output APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/AnsweringMachine-v1.0-debug.apk \;
          ls -lh output_apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnsweringMachine-APK
          path: output_apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Answering Machine v1.0.0 (APK)"
          body: |
            ### 📞 Answering Machine Android App (v1.0.0)
            
            Automated build generated by GitHub Actions.
            
            #### Features Included:
            - **Personalized Voice Greetings Studio:** Record voice greetings or synthesize with AI TTS.
            - **Incoming Call Screening Simulator:** Real-time caller voice transcription and decibel meter.
            - **Voicemail Inbox:** AI summaries, bullet action points, and audio waveform playback.
            - **Zero-Knowledge Privacy:** 100% on-device local storage.
            
            #### Download:
            Download the `AnsweringMachine-v1.0-debug.apk` file below and install it directly on your Android device.
          files: output_apk/AnsweringMachine-v1.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
